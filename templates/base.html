<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CJ WORKOUT — كابتن CJ وياك{% endblock %}</title>
  <meta name="description" content="{% block description %}منصة CJ WORKOUT للياقة والتغذية الذكية: خطط تدريب وتغذية شخصية، متابعة تقدمك، ووصفات عراقية دايت.{% endblock %}">
  <meta property="og:title" content="CJ WORKOUT — كابتن CJ وياك">
  <meta property="og:description" content="خطط تدريب وتغذية شخصية، متابعة تقدمك، ووصفات عراقية دايت.">
  <meta property="og:locale" content="ar_IQ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // يطبّق المظهر المحفوظ فورًا (قبل الرسم) لتفادي وميض بلون خاطئ — "تلقائي" = يتبع نظام الجهاز
    (function () {
      try {
        var t = localStorage.getItem("cj_theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="toast-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
