<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CJ FOOD</title>
    <!-- إثبات ملكية الموقع لـGoogle AdSense (ca-pub-1010119768826215) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1010119768826215"
     crossorigin="anonymous"></script>
    <script>
      // يُطبَّق قبل أول Paint حتى ما يصير "ومضة" لون خاطئ لحظة تحميل الصفحة —
      // نفس مفتاح localStorage ("cj_theme") المستخدم بالنسخة الأصلية (static/js/settings.js)
      // القائمة يدويًا مطابقة لـsettings.mts's THEMES + frontend/src/lib/themes.ts (لا يمكن
      // استيراد وحدة TS بسكربت ما قبل React) — لو أضفت ثيم جديد حدّث هذي القائمة أيضًا.
      try {
        var t = localStorage.getItem("cj_theme");
        var valid = ["light", "dark", "midnight", "ocean", "emerald", "sunset", "aurora", "carbon"];
        if (valid.indexOf(t) !== -1) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
